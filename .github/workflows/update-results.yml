name: Run Hyrox Scraper & Update CSV

on:
  workflow_dispatch:
    inputs:
      locations:
        description: 'Location slugs separated by commas. Default is set to Bangkok, Jakarta, and Singapore.'
        required: false
        default: 'bangkok,jakarta,singapore'
        type: string

jobs:
  run-script:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Hyrox Scraper Script
        shell: pwsh
        run: |
          $csvPath = Join-Path $PWD "results.csv"
          $targetLocations = "${{ inputs.locations }}"
          
          if (-not [string]::IsNullOrWhiteSpace($targetLocations)) {
              Write-Host "Running script for specific locations: $targetLocations"
              ./Get-HyroxAsiaRelayMen.ps1 -OutFile $csvPath -Only $targetLocations.Split(',')
          } else {
              Write-Host "Running script for all Asian locations..."
              ./Get-HyroxAsiaRelayMen.ps1 -OutFile $csvPath
          }

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Hyrox race results for Bangkok, Jakarta, Singapore"
          file_pattern: "results.csv"
