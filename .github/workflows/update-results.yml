name: Run Hyrox Scraper & Update CSV

on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Comma-separated, or All. Options: Women, Men, ProMen, DoublesMen, DoublesMenPro, DoublesWomen, DoublesMixed, TeamRelayMen, TeamRelayMixed'
        required: true
        default: 'All'
        type: string
      locations:
        description: 'Comma-separated location slugs, or All. Use hyphens for multi-word names, e.g. singapore,jakarta,kuala-lumpur'
        required: true
        default: 'All'
        type: string

# Needed so the commit step can push the updated CSVs back to the repo
permissions:
  contents: write

# Never run two scrapes at once: they would both try to push the same CSV files
concurrency:
  group: hyrox-scraper
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Hyrox Scraper Script
        shell: pwsh
        env:
          CATEGORIES: ${{ inputs.categories }}
          LOCATIONS: ${{ inputs.locations }}
        run: |
          # CSVs are written to the repo root, next to index.html
          # (an empty value counts as All; casting to [string] avoids a $null env var)
          $cats = @(([string]$env:CATEGORIES).Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($cats.Count -eq 0) { $cats = @('All') }

          $locs = @(([string]$env:LOCATIONS).Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })

          $params = @{ Category = $cats; OutDir = $PWD.Path }

          if ($locs.Count -gt 0 -and $locs -notcontains 'All') {
              $params.Only = $locs
              Write-Host "Categories: $($cats -join ', ') | Locations: $($locs -join ', ')"
          } else {
              Write-Host "Categories: $($cats -join ', ') | Locations: all Asian locations"
          }

          ./Scrape-HyroxAsia.ps1 @params

      # Keep the per-event debug logs as a downloadable artifact instead of committing them
      - name: Upload event logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyrox-event-logs
          path: Hyrox_Asia_*_EventLog.csv
          if-no-files-found: ignore

      - name: Remove event logs before commit
        if: always()
        shell: pwsh
        run: Remove-Item "Hyrox_Asia_*_EventLog.csv" -ErrorAction SilentlyContinue

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Hyrox race results (${{ inputs.categories }}: ${{ inputs.locations }})"
          file_pattern: "Hyrox_Asia_*.csv"
