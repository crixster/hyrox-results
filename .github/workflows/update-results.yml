name: Run Hyrox Scraper & Update CSV

on:
  workflow_dispatch:
    inputs:
      locations:
        description: 'Optional: Location slugs separated by commas (e.g. bangkok,jakarta,singapore). Leave blank for all.'
        required: false
        default: ''
        type: string

jobs:
  run-script:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Hyrox Scraper Script
        shell: pwsh
        run: |
          # Output directly to results.csv
          $csvPath = Join-Path $PWD "results.csv"
          $targetLocations = "${{ inputs.locations }}"
          
          if (-not [string]::IsNullOrWhiteSpace($targetLocations)) {
              Write-Host "Running script for specific locations: $targetLocations"
              ./Get-HyroxAsiaRelayMen.ps1 -OutFile $csvPath -Only $targetLocations.Split(',')
          } else {
              Write-Host "Running script for all Asian locations..."
              ./Get-HyroxAsiaRelayMen.ps1 -OutFile $csvPath
          }

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Hyrox race results to results.csv via GitHub Actions"
          file_pattern: "results.csv"
